<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Nadu Animal Welfare Board — Dog Adoption Portal</title>
<style>
:root{--ink:#20302b;--muted:#6d7b75;--green:#246b50;--green2:#e8f3ed;--cream:#fbfaf6;--line:#e4e9e4;--orange:#e89b54;--red:#b84b45;--shadow:0 12px 35px #183c2b12}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--green);color:#fff}
button:hover{filter:brightness(.94)}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--green)}
.secondary{background:#edf2ee;color:var(--ink)}
.danger{background:#fff0ef;color:var(--red)}
.small{padding:7px 11px;font-size:13px}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-size:20px;font-weight:900;letter-spacing:-.5px;line-height:1.2;color:var(--green);cursor:pointer}
.brand span{color:var(--orange)}
.navlinks{display:flex;gap:8px;flex-wrap:wrap}
.navlinks button{background:transparent;color:var(--ink);padding:9px 12px}
.navlinks button.active{background:var(--green2);color:var(--green)}
.wrap{max-width:1180px;margin:30px auto;padding:0 22px;min-height:60vh}
.hero{background:linear-gradient(120deg,#e9f3ec,#f9efe2);border-radius:24px;padding:38px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;overflow:hidden}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.04;letter-spacing:-2px;margin:8px 0 14px}
.hero p{color:#52645b;max-width:550px}
.hero-art{font-size:120px;text-align:center;filter:drop-shadow(0 15px 12px #345b3b25)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.eyebrow{color:var(--green);font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 16px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:26px;letter-spacing:-.7px}
.muted{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.filters input,.filters select{max-width:240px}
.dog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.dog-card,.panel,.stat,.step{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.dog-card{overflow:hidden}
.dog-img{height:190px;background:#edf2ee;display:flex;align-items:center;justify-content:center;font-size:75px;overflow:hidden}
.dog-img img{width:100%;height:100%;object-fit:cover}
.dog-body{padding:16px}
.dog-body h3{margin:0 0 4px;font-size:19px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{font-size:11px;padding:4px 8px;border-radius:30px;background:#edf4ef;color:#37634d;font-weight:700}
.tag.warn{background:#fff3df;color:#93611d}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.panel{padding:22px;margin:18px 0}
.panel h2,.panel h3{margin-top:0}
.hidden{display:none!important}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:750;color:#42534a}
label.chk{display:flex;gap:9px;align-items:flex-start;font-weight:600}
label.chk input{margin-top:3px;flex:none}
input,select,textarea{width:100%;border:1px solid #dce4dd;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #246b5015}
input[type=checkbox]{width:auto}
textarea{min-height:90px;resize:vertical}
.sect{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.stat{padding:17px}
.stat strong{display:block;font-size:28px;color:var(--green)}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
table.kv{min-width:0}
table.kv th{width:42%;text-transform:none;letter-spacing:0;font-size:13px;color:#42534a}
.status{display:inline-block;padding:4px 9px;border-radius:30px;background:#f2f3ef;font-size:11px;font-weight:800;text-transform:capitalize}
.status.pending{background:#fff3df;color:#93611d}
.status.approved{background:#e8f5ed;color:#246b50}
.status.rejected{background:#fff0ef;color:#b84b45}
.status.adopted{background:#e6eefc;color:#2b5aa8}
.notice{padding:12px 14px;background:#f3f7f3;border-radius:12px;color:#52645b;font-size:13px}
.notice.warn{background:#fff3df;color:#93611d}
.login-box{max-width:460px;margin:55px auto}
.login-box.wide{max-width:760px;margin:30px auto}
.login-box .panel{padding:28px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:#edf2ee;color:var(--ink);padding:8px 14px}
.tabs button.active{background:var(--green);color:#fff}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.step{padding:20px}
.step h3{margin:0 0 6px;font-size:17px}
.step p{margin:0;color:#52645b}
.step-num{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:10px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed var(--line)}
.checklist li:last-child{border-bottom:0}
.checklist li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:750}
details[open] summary{margin-bottom:8px}
details p{margin:0;color:#52645b}
.docs{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.docs figure{margin:0}
.docs img{max-height:110px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.docs img.zoomed{max-height:none;max-width:100%;cursor:zoom-out}
.docs figcaption{font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:#14231dcc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{background:#fff;border-radius:20px;max-width:740px;width:100%;max-height:92vh;overflow:auto;padding:24px}
.modal h4{margin:20px 0 8px}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-top h2{margin:0}
.close{background:#edf2ee;color:#20302b;padding:7px 11px}
.empty{text-align:center;padding:35px;color:var(--muted);grid-column:1/-1}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#edf2ee;display:inline-flex;align-items:center;justify-content:center;font-size:22px;vertical-align:middle}
.toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#20302b;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);animation:pop .25s ease}
.toast.err{background:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{text-align:center;color:var(--muted);padding:35px 15px;font-size:13px}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:26px}.hero-art{font-size:75px}.form-grid,.two-col{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{align-items:flex-start;flex-direction:column}.wrap{margin:20px auto}}
</style>
</head>
<body>

<header class="top">
  <div class="nav">
    <div class="brand" data-action="goto" data-page="public">Tamil Nadu <span>Animal Welfare</span> Board 🐾</div>
    <div class="navlinks" id="navlinks"></div>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer>Tamil Nadu Animal Welfare Board · Dog Adoption Portal · Helping dogs find caring homes 🐾</footer>
<div id="modalRoot"></div>
<div class="toast-root" id="toasts"></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     Storage — falls back to memory if localStorage is blocked
     ===================================================================== */
  const DB_KEY = 'goodpaw_v3_db', OLD_KEY = 'goodpaw_v2_db', SESSION_KEY = 'goodpaw_v3_session';
  const mem = {};
  const sGet = k => { if (k in mem) return mem[k]; try { return localStorage.getItem(k); } catch (e) { return null; } };
  const sSet = (k, v) => { try { localStorage.setItem(k, v); delete mem[k]; return true; } catch (e) { mem[k] = v; return false; } };
  const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return mem['s_' + k] || null; } };
  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) { mem['s_' + k] = v; } };

  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);
  const uid = () => Date.now() + Math.floor(Math.random() * 1000);
  const today = () => new Date().toLocaleDateString();
  const fmt = v => v === true ? 'Yes' : v === false ? 'No' : (v == null ? '' : String(v));
  const ADMIN = { user: 'admin', pass: hash('admin123') };

  function seed() {
    return {
      ngos: [{ id: 1, username: 'ngo', name: 'Demo NGO', pass: hash('ngo123'), reg: 'approved', regNo: 'TN/AWO/2020/001', address: '12 Anna Salai, Chennai', phone: '9840012345', email: 'care@demongo.org', rep: 'R. Kumar', districts: 'Chennai, Coimbatore', vet: 'Tie-up with a local veterinary clinic', awbi: 'Recognised', date: today() }],
      dogs: [
        { id: 1, ngoId: 1, ngo: 'Demo NGO', name: 'Milo', tag: 'DN-001', breed: 'Indie', age: 'Young', ageEst: 'About 1.5 years', gender: 'Male', location: 'Chennai', vaccine: 'Vaccinated', dewormed: 'Yes', sterilised: 'Yes', marks: 'Brown coat with a white patch on the chest', rescue: 'Rescued from a roadside as a puppy and raised at the shelter.', about: 'Friendly, playful and people-loving. Milo enjoys walks and would make a wonderful family companion.', photo: '', status: 'approved', date: today() },
        { id: 2, ngoId: 1, ngo: 'Demo NGO', name: 'Luna', tag: 'DN-002', breed: 'Indie mix', age: 'Puppy', ageEst: 'About 3 months', gender: 'Female', location: 'Coimbatore', vaccine: 'Partially vaccinated', dewormed: 'Yes', sterilised: 'Too young', marks: 'Black with tan eyebrows', rescue: 'Found with her litter near a construction site.', about: 'A curious and gentle puppy looking for a safe, loving home.', photo: '', status: 'approved', date: today() }
      ],
      requests: []
    };
  }

  function load() {
    try {
      let raw = sGet(DB_KEY), d;
      if (!raw) {
        const old = sGet(OLD_KEY);
        d = old ? JSON.parse(old) : seed();
        d.ngos = (d.ngos || []).map(n => Object.assign({ reg: 'approved' }, n));
        sSet(DB_KEY, JSON.stringify(d));
      } else d = JSON.parse(raw);
      d.dogs = d.dogs || []; d.requests = d.requests || []; d.ngos = d.ngos || [];
      return d;
    } catch (e) { return seed(); }
  }
  function save(d) {
    const ok = sSet(DB_KEY, JSON.stringify(d));
    if (!ok) toast('Browser storage is full or blocked — changes may not persist after closing this page.', true);
    return ok;
  }

  /* =====================================================================
     State
     ===================================================================== */
  const state = { page: 'public', session: null, ngoMode: 'login', adminTab: 'dogs', editId: null, dogFilter: 'all' };
  const pubFilter = { q: '', district: '', age: '', gender: '' };
  try { const s = ssGet(SESSION_KEY); if (s) state.session = JSON.parse(s); } catch (e) {}
  const setSession = s => { state.session = s; ssSet(SESSION_KEY, s ? JSON.stringify(s) : ''); };

  const isAdmin = () => !!state.session && state.session.role === 'admin';
  function currentNgo() {
    if (!state.session || state.session.role !== 'ngo') return null;
    return load().ngos.find(n => n.id === state.session.ngoId) || null;
  }
  function canManage(r, data) {
    if (isAdmin()) return true;
    const ngo = currentNgo(); if (!ngo || ngo.reg !== 'approved') return false;
    const d = data.dogs.find(x => x.id === r.dogId);
    return !!d && d.ngoId === ngo.id;
  }

  /* =====================================================================
     Shared definitions
     ===================================================================== */
  const AGES = ['Puppy', 'Young', 'Adult', 'Senior'];
  const FU = [
    ['d7', 'Within 7 days', 'Confirm safe handover and initial adjustment', 7],
    ['d30', 'Within 30 days', 'Verify feeding, health, housing and well-being', 30],
    ['m3', 'Within 3 months', 'Assess continued care and address any concerns', 90],
    ['m6', 'Within 6 months', 'Complete follow-up and update the adoption record', 180]
  ];
  const APP_GROUPS = [
    ['About the adopter', [['name', 'Full name'], ['age', 'Age'], ['phone', 'Mobile'], ['email', 'Email'], ['occupation', 'Occupation'], ['city', 'District / city'], ['address', 'Residential address'], ['idType', 'ID proof type'], ['idNumber', 'ID number (last 4 characters)']]],
    ['Home & household', [['housing', 'Type of home'], ['petPermission', 'Landlord / society allows pets'], ['homeSecure', 'Home / compound secure'], ['familyCount', 'Family members'], ['allAgree', 'All household members agree'], ['children', 'Children under 12 at home'], ['allergies', 'Pet allergies in household'], ['stay', 'Where the dog will stay'], ['hoursAlone', 'Hours alone each day']]],
    ['Experience & other pets', [['experience', 'Experience with dogs'], ['otherPets', 'Other pets at home'], ['pastPets', 'Previous pets'], ['surrendered', 'Ever given up or abandoned a pet'], ['surrenderedWhy', 'Details'], ['backupCare', 'Care when travelling / unwell'], ['moving', 'Planned moves or major changes']]],
    ['Care & finances', [['budget', 'Monthly budget for the dog'], ['training', 'Training approach']]],
    ['About this adoption', [['reason', 'Reason for adopting'], ['alternative', 'Open to another dog if not a match']]],
    ['Declarations', [['declAccurate', 'Details are true and correct'], ['declHouseCheck', 'Agrees to house check (visit / video call)'], ['declFollowUp', 'Agrees to 6-month follow-up'], ['declNoAbandon', 'Will never abandon; will return dog to NGO if unable to keep'], ['declCare', 'Will provide vaccination, deworming, sterilisation & vet care']]]
  ];
  const TEXT_FIELDS = ['name', 'age', 'phone', 'email', 'occupation', 'city', 'address', 'idType', 'idNumber', 'housing', 'petPermission', 'homeSecure', 'familyCount', 'allAgree', 'children', 'allergies', 'stay', 'hoursAlone', 'experience', 'otherPets', 'pastPets', 'surrendered', 'surrenderedWhy', 'backupCare', 'moving', 'budget', 'training', 'reason', 'alternative'];
  const BOOL_FIELDS = ['declAccurate', 'declHouseCheck', 'declFollowUp', 'declNoAbandon', 'declCare'];

  /* =====================================================================
     UI helpers
     ===================================================================== */
  function toast(msg, isErr) {
    const t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(() => t.remove(), 4200);
  }
  const imgTag = d => d.photo ? `<img src="${d.photo}" alt="${esc(d.name)}">` : '🐶';
  const statusTag = s => `<span class="status ${esc(s)}">${esc(s)}</span>`;
  const opts = (list, sel) => list.map(o => `<option${o === sel ? ' selected' : ''}>${esc(o)}</option>`).join('');
  const F = (label, html, full) => `<div class="field${full ? ' full' : ''}"><label>${label}</label>${html}</div>`;
  const sel = (n, list, req = true, cur = '') => `<select name="${n}"${req ? ' required' : ''}><option value="">Select</option>${opts(list, cur)}</select>`;
  const inp = (n, extra = '', req = true, type = 'text', val = '') => `<input name="${n}" type="${type}"${req ? ' required' : ''} value="${esc(val)}" ${extra}>`;
  const txt = (n, req = true, ph = '', val = '') => `<textarea name="${n}"${req ? ' required' : ''} placeholder="${esc(ph)}">${esc(val)}</textarea>`;
  const chk = (n, text) => `<div class="field full"><label class="chk"><input type="checkbox" name="${n}" required><span>${text}</span></label></div>`;
  const H = t => `<div class="field full"><div class="eyebrow sect">${t}</div></div>`;
  const kvTable = rows => `<div class="table-wrap"><table class="kv">${rows.map(([l, v]) => `<tr><th>${esc(l)}</th><td>${v === '' || v == null ? '<span class="muted">—</span>' : v}</td></tr>`).join('')}</table></div>`;

  function renderNav() {
    const items = [['public', 'Find a Dog'], ['howto', 'How to Adopt'], ['ngo', 'NGO Portal'], ['admin', 'Admin']];
    $('navlinks').innerHTML = items.map(i => `<button class="${state.page === i[0] ? 'active' : ''}" data-action="goto" data-page="${i[0]}">${i[1]}</button>`).join('');
  }
  function go(page) { state.page = page; render(); window.scrollTo(0, 0); }
  function render() {
    renderNav();
    const app = $('app');
    app.innerHTML = state.page === 'public' ? publicView() : state.page === 'howto' ? howtoView() : state.page === 'ngo' ? ngoView() : adminView();
    if (state.page === 'public') renderDogGrid();
  }
  function processImage(file, max, q) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('Could not read the image.'));
      fr.onload = () => {
        const im = new Image();
        im.onerror = () => reject(new Error('"' + file.name + '" is not a valid image. Please upload a JPG or PNG photo.'));
        im.onload = () => {
          const r = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', q));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* =====================================================================
     PUBLIC: Find a dog
     ===================================================================== */
  function publicView() {
    const data = load();
    const districts = [...new Set(data.dogs.filter(d => d.status === 'approved').map(d => d.location))].sort();
    return `<div class="hero"><div><div class="eyebrow">A home. A family. A second chance.</div>
      <h1>Every dog deserves<br>a loving home.</h1>
      <p>Meet dogs waiting for adoption from registered animal welfare organisations. Find your new best friend, read how adoption works, and send an adoption application.</p>
      <div class="hero-actions"><button data-action="scroll">Meet the dogs</button><button class="secondary" data-action="goto" data-page="howto">How to adopt</button></div></div>
      <div class="hero-art">🐕 🐾</div></div>
      <div class="section-head"><div><div class="eyebrow">Ready for a home</div><h2 id="availableDogs">Dogs available for adoption</h2></div><span class="muted" id="dogCount"></span></div>
      <div class="filters">
        <input id="searchDog" placeholder="Search by name, breed or tag..." value="${esc(pubFilter.q)}">
        <select id="filterDistrict"><option value="">All districts</option>${opts(districts, pubFilter.district)}</select>
        <select id="filterAge"><option value="">All ages</option>${opts(AGES, pubFilter.age)}</select>
        <select id="filterGender"><option value="">All genders</option>${opts(['Male', 'Female'], pubFilter.gender)}</select>
      </div>
      <div class="dog-grid" id="publicDogs"></div>`;
  }

  function renderDogGrid() {
    const data = load(), q = pubFilter.q.toLowerCase();
    const dogs = data.dogs.filter(d => d.status === 'approved' &&
      (d.name + ' ' + d.breed + ' ' + (d.tag || '')).toLowerCase().includes(q) &&
      (!pubFilter.district || d.location === pubFilter.district) &&
      (!pubFilter.age || d.age === pubFilter.age) && (!pubFilter.gender || d.gender === pubFilter.gender));
    $('dogCount').textContent = dogs.length + ' dog(s)';
    $('publicDogs').innerHTML = dogs.length ? dogs.map(d => {
      const busy = data.requests.some(r => r.dogId === d.id && r.status === 'pending');
      const about = d.about.length > 110 ? esc(d.about.slice(0, 110)) + '…' : esc(d.about);
      return `<article class="dog-card"><div class="dog-img">${imgTag(d)}</div><div class="dog-body">
        <h3>${esc(d.name)}</h3><div class="muted">${esc(d.breed)} · ${esc(d.age)} · ${esc(d.gender)}</div>
        <div class="tags"><span class="tag">${esc(d.location)}</span><span class="tag">${esc(d.vaccine || 'Vaccination unknown')}</span>${d.sterilised === 'Yes' ? '<span class="tag">Sterilised</span>' : ''}${busy ? '<span class="tag warn">Application in process</span>' : ''}</div>
        <p class="muted">${about}</p>
        <div class="card-foot"><small class="muted">Listed by ${esc(d.ngo)}</small><button class="small" data-action="open-dog" data-id="${d.id}">View &amp; adopt</button></div></div></article>`;
    }).join('') : '<div class="empty">No dogs match your search right now. Please check again later.</div>';
  }

  function openDog(id) {
    const data = load(), d = data.dogs.find(x => x.id === id); if (!d) return;
    const ngo = data.ngos.find(n => n.id === d.ngoId) || {};
    const busy = data.requests.some(r => r.dogId === d.id && r.status === 'pending');
    $('modalRoot').innerHTML = `<div class="modal-backdrop" data-action="backdrop"><div class="modal">
      <div class="modal-top"><h2>${esc(d.name)} is waiting for you 🐾</h2><button class="close" data-action="close-modal" aria-label="Close">✕</button></div>
      <div class="dog-img" style="border-radius:14px;margin:12px 0">${imgTag(d)}</div>
      ${busy ? '<p class="notice warn">An application for this dog is already being processed. You can still apply — the organisation decides after reviewing all applications.</p>' : ''}

  function ngoAuth(form) {
    const f = form.elements, data = load(), user = f.username.value.trim().toLowerCase(), pass = f.password.value;
    if (state.ngoMode === 'register') {
      if (data.ngos.some(n => n.username === user)) return toast('That username is already taken.', true);
      data.ngos.push({ id: uid(), username: user, name: f.orgname.value.trim(), pass: hash(pass), reg: 'pending', regNo: f.regNo.value.trim(), rep: f.rep.value.trim(), phone: f.phone.value.trim(), email: f.email.value.trim(), districts: f.districts.value.trim(), address: f.address.value.trim(), vet: f.vet.value.trim(), awbi: f.awbi.value, date: today() });
      save(data); state.ngoMode = 'login'; render(); window.scrollTo(0, 0);
      toast('Registration submitted. You can log in once the administrator verifies your organisation.');
    } else {
      const n = data.ngos.find(x => x.username === user && x.pass === hash(pass));
      if (!n) return toast('Invalid username or password.', true);
      if (n.reg === 'pending') return toast('Your registration is still awaiting verification by the administrator.', true);
      if (n.reg === 'rejected') return toast('Your registration was not approved. Please contact the administrator.', true);
      setSession({ role: 'ngo', ngoId: n.id }); render();
    }
  }

  function submitDog(form) {

      ['name', 'tag', 'breed', 'age', 'ageEst', 'gender', 'location', 'marks', 'vaccine', 'dewormed', 'sterilised', 'about', 'rescue'].forEach(k => { fields[k] = f[k].value.trim(); });

  function viewRequest(id) {
    const data = load(), r = data.requests.find(x => x.id === id); if (!r || !canManage(r, data)) return;
    const d = data.dogs.find(x => x.id === r.dogId) || {};
    const groups = APP_GROUPS.map(([t, fs]) => `<h4>${t}</h4>${kvTable(fs.map(([k, l]) => [l, fmt(r[k]) ? esc(fmt(r[k])) : '']))}`).join('');
    const docs = r.docs ? `<h4>Documents</h4><div class="docs">${[['passport', 'Passport photo'], ['idProof', 'ID proof'], ['addressProof', 'Address proof']].filter(x => r.docs[x[0]]).map(x => `<figure><img src="${r.docs[x[0]]}" alt="${x[1]}" data-action="zoom"><figcaption class="muted">${x[1]} — click to enlarge</figcaption></figure>`).join('')}</div>` : '';
    const hc = r.houseCheck || {};
    let hcHtml;

      hcHtml = `<h4>House check (AWBI Annexure I)</h4><form id="houseForm" data-id="${r.id}"><div class="form-grid">

        ${F('Mode *', sel('mode', ['Home visit', 'Video call'], true, hc.mode))}
        ${F('Result *', sel('result', ['Suitable', 'Needs changes', 'Not suitable'], true, hc.result))}
        ${F('Notes', txt('notes', false, 'Space, safety, family attitude, etc.', hc.notes || ''), true)}
        </div><div class="actions"><button class="small">Save house check</button></div></form>`;
    } else hcHtml = `<h4>House check</h4>${r.houseCheck ? kvTable([['Date', esc(hc.date)], ['Mode', esc(hc.mode)], ['Result', esc(hc.result)], ['Notes', esc(hc.notes)]]) : '<p class="muted">No house check recorded.</p>'}`;

    let decision = '';

      decision = `<h4>Decision</h4><div class="form-grid">${F('Adoption certificate no. (on approval)', '<input id="certNo">')}${F('Reason (if rejecting)', '<input id="rejReason">')}</div>

          return `<tr><td><b>${label}</b><br><small class="muted">${desc}</small></td><td>${due}</td><td>${done ? `<span class="status approved">Done ${esc(done.date)}</span><br><small>${esc(done.note || '')}</small>` : `<input id="fu_${k}" placeholder="Note (health, feeding…)" style="margin-bottom:6px"><button class="small" data-action="followup" data-id="${r.id}" data-key="${k}">Mark done</button>`}</td></tr>`; }).join('')}</table></div>`;

  function saveHouseCheck(form) {
    const id = Number(form.dataset.id), data = load(), r = data.requests.find(x => x.id === id);
    if (!r || !canManage(r, data)) return;
    r.houseCheck = { date: form.elements.date.value, mode: form.elements.mode.value, result: form.elements.result.value, notes: form.elements.notes.value.trim() };
    save(data); render(); viewRequest(id); toast('House check saved.');
  }

  function decide(id, status) {
    const data = load(), r = data.requests.find(x => x.id === id);
    if (!r || !canManage(r, data) || r.status !== 'pending') return;
    const val = i => ($(i) ? $(i).value.trim() : '');
    if (status === 'approved') {
      if (!r.houseCheck && !confirm('No house check has been recorded for this applicant. Approve anyway?')) return;
      if (r.houseCheck && r.houseCheck.result === 'Not suitable' && !confirm('The house check result is "Not suitable". Approve anyway?')) return;
      r.status = 'approved'; r.decidedOn = new Date().toLocaleString(); r.decidedAt = Date.now();
      r.certificate = { no: val('certNo'), date: today() };
      const dog = data.dogs.find(x => x.id === r.dogId); if (dog) dog.status = 'adopted';
      data.requests.forEach(o => { if (o.dogId === r.dogId && o.id !== r.id && o.status === 'pending') { o.status = 'rejected'; o.decidedOn = r.decidedOn; o.rejectReason = 'Dog was adopted by another applicant'; } });
      toast('Adoption approved. Dog marked as adopted; other pending applications were closed.');
    } else {
      r.status = 'rejected'; r.decidedOn = new Date().toLocaleString(); r.rejectReason = val('rejReason');
      toast('Application rejected.');
    }
    save(data); render(); viewRequest(id);
  }

  function markFollowup(id, key) {
    const data = load(), r = data.requests.find(x => x.id === id);
    if (!r || !canManage(r, data)) return;
    r.followups = r.followups || {};
    r.followups[key] = { date: today(), note: ($('fu_' + key) ? $('fu_' + key).value.trim() : '') };
    save(data); render(); viewRequest(id); toast('Follow-up recorded.');
  }

  var CRC_TABLE = (function () {
    var t = [], c, n, k;
    for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }

  })();

    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipStore(files) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0, now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.content), crc = crc32(data), size = data.length;
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(10, 0, true); c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
      c.setUint32(20, size, true); c.setUint32(24, size, true); c.setUint16(28, name.length, true);
      c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
      c.setUint32(38, 0, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);

    });
    var cdSize = 0; central.forEach(function (p) { cdSize += p.length; });
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
    e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);

  }
  function xmlEsc(s) {
    return String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function colLetter(n) { var s = ''; n++; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }

  function buildXlsx(sheetName, headers, rows, widths) {
    function cell(v, r, c, style) {
      return '<c r="' + colLetter(c) + r + '" t="inlineStr"' + (style ? ' s="' + style + '"' : '') + '><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
    }
    var sheetRows = '<row r="1">' + headers.map(function (h, i) { return cell(h, 1, i, 1); }).join('') + '</row>' +
      rows.map(function (row, ri) {
        return '<row r="' + (ri + 2) + '">' + row.map(function (v, ci) { return cell(v, ri + 2, ci, 2); }).join('') + '</row>';
      }).join('');
    var cols = '<cols>' + widths.map(function (w, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols>';
    var head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    var ns = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
    return zipStore([
      { name: '[Content_Types].xml', content: head + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', content: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', content: head + '<workbook ' + ns + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + xmlEsc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', content: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', content: head + '<styleSheet ' + ns + '><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF246B50"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },
      { name: 'xl/worksheets/sheet1.xml', content: head + '<worksheet ' + ns + '><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + sheetRows + '</sheetData></worksheet>' }
    ]);
  }

  

  function exportAdopted(ngoId) {
    const data = load();
    const accepted = data.requests.filter(r => {
      if (r.status !== 'approved') return false;
      if (!ngoId) return true;
      const d = data.dogs.find(x => x.id === r.dogId); return d && d.ngoId === ngoId;
    });
    if (!accepted.length) return toast('No adopted dogs yet. Approve an adoption application first.', true);
    const flat = [].concat(...APP_GROUPS.map(g => g[1]));
    const headers = ['S.No', 'Dog name', 'Dog tag', 'Breed', 'Age group', 'Sex', 'District', 'NGO', 'Application submitted', 'Adoption approved on', 'Certificate no.',
      'House check date', 'House check mode', 'House check result', 'House check notes'].concat(FU.map(f => 'Follow-up ' + f[1].toLowerCase()), flat.map(f => f[1]));
    const widths = headers.map(h => h === 'S.No' ? 6 : /address|reason|notes|Details|Care when|moves|Previous|Declar|Will never|Agrees|Will provide/i.test(h) ? 38 : 20);
    const rows = accepted.map((r, i) => {
      const d = data.dogs.find(x => x.id === r.dogId) || {}, hc = r.houseCheck || {}, fu = r.followups || {};
      return [i + 1, d.name || 'Listing removed', d.tag, d.breed, d.age, d.gender, d.location, d.ngo, r.date, r.decidedOn || '', (r.certificate && r.certificate.no) || '',
        hc.date, hc.mode, hc.result, hc.notes].concat(FU.map(f => fu[f[0]] ? 'Done ' + fu[f[0]].date + (fu[f[0]].note ? ' — ' + fu[f[0]].note : '') : 'Pending'), flat.map(f => fmt(r[f[0]])));
    });
    const blob = buildXlsx('Adopted dogs', headers, rows, widths);
    const now = new Date(), pad = n => (n < 10 ? '0' : '') + n;
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'tnawb-adopted-' + now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + '.xlsx';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    toast('Downloaded ' + accepted.length + ' adopted record(s).');
  }

  /* =====================================================================
     Events (delegated, so nothing breaks on re-render)
     ===================================================================== */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const a = el.dataset.action, id = Number(el.dataset.id);
    if (a === 'backdrop') { if (e.target === el) closeModal(); return; }
    if (a === 'toggle-ngo-mode') e.preventDefault();
    let data;
    switch (a) {
      case 'goto': closeModal(); go(el.dataset.page); break;
      case 'howto-from-modal': closeModal(); go('howto'); break;
      case 'scroll': { const t = $('availableDogs'); if (t) t.scrollIntoView({ behavior: 'smooth' }); break; }
      case 'open-dog': openDog(id); break;
      case 'apply': openApply(id); break;
      case 'close-modal': closeModal(); break;
      case 'zoom': el.classList.toggle('zoomed'); break;
      case 'logout': setSession(null); state.editId = null; closeModal(); go('public'); toast('Logged out.'); break;
      case 'toggle-ngo-mode': state.ngoMode = state.ngoMode === 'login' ? 'register' : 'login'; render(); break;
      case 'edit-dog': state.editId = id; render(); window.scrollTo(0, 0); break;
      case 'cancel-edit': state.editId = null; render(); break;
      case 'delete-dog': {
        if (!confirm('Delete this dog listing?')) break;
        const ngo = currentNgo(); data = load();
        data.dogs = data.dogs.filter(d => !(d.id === id && ngo && d.ngoId === ngo.id && d.status !== 'adopted'));
        data.requests = data.requests.filter(r => data.dogs.some(d => d.id === r.dogId));
        save(data); toast('Listing deleted.'); render(); break;
      }
      case 'admin-delete-dog':
        if (!isAdmin() || !confirm('Permanently delete this dog and its applications?')) break;
        data = load(); data.dogs = data.dogs.filter(d => d.id !== id); data.requests = data.requests.filter(r => r.dogId !== id);
        save(data); render(); break;
      case 'admin-tab': state.adminTab = el.dataset.tab; render(); break;
      case 'dog-status': {
        if (!isAdmin()) break;
        data = load(); const dog = data.dogs.find(d => d.id === id);
        if (dog) { dog.status = el.dataset.status; save(data); render(); toast('Dog marked ' + dog.status + '.'); } break;
      }
      case 'ngo-reg': {
        if (!isAdmin()) break;
        data = load(); const n = data.ngos.find(x => x.id === id);
        if (n) { n.reg = el.dataset.status; save(data); render(); toast(n.name + ' is now ' + n.reg + '.'); } break;
      }
      case 'view-request': viewRequest(id); break;
      case 'req-status': decide(id, el.dataset.status); break;
      case 'followup': markFollowup(id, el.dataset.key); break;
      case 'export-adopted': if (isAdmin()) exportAdopted(); break;
      case 'export-adopted-ngo': { const n = currentNgo(); if (n) exportAdopted(n.id); break; }
      case 'export': {
        if (!isAdmin()) break;
        const blob = new Blob([JSON.stringify(load(), null, 2)], { type: 'application/json' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'tnawb-data.json';
        document.body.appendChild(link); link.click(); link.remove(); break;
      }
      case 'reset':
        if (!isAdmin() || !confirm('Reset ALL data back to the demo data?')) break;
        save(seed()); setSession({ role: 'admin' }); render(); toast('Demo data restored.'); break;
    }
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'requestForm') submitRequest(f);
    else if (f.id === 'dogForm') submitDog(f);
    else if (f.id === 'ngoAuthForm') ngoAuth(f);
    else if (f.id === 'houseForm') saveHouseCheck(f);
    else if (f.id === 'adminForm') {
      if (f.elements.username.value.trim() === ADMIN.user && hash(f.elements.password.value) === ADMIN.pass) { setSession({ role: 'admin' }); render(); }
      else toast('Invalid admin login.', true);
    }
  });
  document.addEventListener('input', e => { if (e.target.id === 'searchDog') { pubFilter.q = e.target.value; renderDogGrid(); } });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'filterDistrict') { pubFilter.district = t.value; renderDogGrid(); }
    else if (t.id === 'filterAge') { pubFilter.age = t.value; renderDogGrid(); }
    else if (t.id === 'filterGender') { pubFilter.gender = t.value; renderDogGrid(); }
    else if (t.id === 'adminDogFilter') { state.dogFilter = t.value; render(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  load();
  render();
})();
</script>
</body>
</html>
